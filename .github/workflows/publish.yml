name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* git tag to attach the tarball to (e.g. v0.1.3)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must match v* (got: $TAG)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Require slim host-ui chunk
        run: |
          if [ ! -f dist/host-ui.js ]; then
            echo "dist/host-ui.js is missing. The host build must write it before tagging."
            echo "Do not ship a tarball that cannot resolve ./host-ui."
            exit 1
          fi

      - name: Pack tarball
        id: pack
        run: |
          TGZ="$(npm pack | tail -n1)"
          test -f "$TGZ"
          if ! tar -tzf "$TGZ" | grep -qx 'package/dist/host-ui.js'; then
            echo "Packed $TGZ does not contain package/dist/host-ui.js"
            exit 1
          fi
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TGZ="${{ steps.pack.outputs.tgz }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" dist/host-ui.js --clobber
          else
            gh release create "$TAG" "$TGZ" dist/host-ui.js \
              --title "$TAG" \
              --generate-notes
          fi
